const CARDS=[{"id":1,"category":"基礎概念","term":"情報セキュリティ","meaning":"情報を漏らさず、改ざんや利用不能を防ぐための考え方","tip":"機密性・完全性・可用性","attack":"","defense":"","why":"","page":"7-8"},{"id":2,"category":"基礎概念","term":"サイバー攻撃","meaning":"コンピューターやネットワークを狙う悪意ある行為","tip":"侵入・窃取・妨害","attack":"侵入・窃取・妨害など複数の手口","defense":"資産管理、更新、MFA、監視、バックアップを重層化","why":"単独対策では侵入・拡大・被害を防ぎきれない","page":"9-41"},{"id":3,"category":"基礎概念","term":"脅威","meaning":"情報資産に被害をもたらす可能性のある要因","tip":"攻撃者や災害など","attack":"","defense":"","why":"","page":"7-8"},{"id":4,"category":"基礎概念","term":"リスク","meaning":"脅威が弱点を突いて損害が生じる可能性と影響","tip":"可能性×影響","attack":"","defense":"","why":"","page":"7-8"},{"id":5,"category":"基礎概念","term":"脆弱性","meaning":"システムや設定のセキュリティ上の弱点","tip":"攻撃の入口","attack":"ソフトや設定の弱点が悪用される","defense":"資産把握、脆弱性診断、優先順位付きパッチ適用","why":"侵入に利用される弱点を減らす","page":"21-23"},{"id":6,"category":"基礎概念","term":"マルウェア","meaning":"有害な動作をするソフトウェアの総称","tip":"ウイルス・ランサムウェアなど","attack":"悪意あるプログラムを実行させる","defense":"EDR・ウイルス対策、OS更新、実行制限、添付ファイル対策","why":"侵入・実行・感染拡大を検知・抑制","page":"7,10"},{"id":7,"category":"基礎概念","term":"不正アクセス","meaning":"許可なくシステムや情報へアクセスする行為","tip":"盗んだIDでも起こる","attack":"盗んだ認証情報や弱点で無断侵入","defense":"MFA、最小権限、アクセス制御、ログ監視","why":"なりすましと権限の悪用を抑える","page":"10,25"},{"id":8,"category":"基礎概念","term":"認証情報","meaning":"利用者本人であることを確かめるための情報","tip":"ID・パスワードなど","attack":"","defense":"","why":"","page":"10-11"},{"id":9,"category":"基礎概念","term":"情報漏えい","meaning":"守るべき情報が許可なく外部に知られること","tip":"意図的・偶発的","attack":"情報が意図せず・不正に外へ出る","defense":"データ分類、暗号化、DLP、権限管理、監査ログ","why":"外部への流出を防ぎ事後追跡できる","page":"多数"},{"id":10,"category":"基礎概念","term":"情報窃取","meaning":"攻撃者が情報を不正に盗み取ること","tip":"漏えいの一原因","attack":"侵入・詐欺・マルウェアで秘密を盗む","defense":"MFA、データ暗号化、DLP、EDR、アクセス制限","why":"取得経路を狭め被害を限定する","page":"10-11"},{"id":11,"category":"基礎概念","term":"改ざん","meaning":"データやWebページを不正に書き換えること","tip":"完全性の侵害","attack":"データ・Webページを不正変更","defense":"アクセス制御、改ざん検知、変更管理、バックアップ","why":"不正な書換えの阻止・検出・復旧","page":"21"},{"id":12,"category":"基礎概念","term":"ソーシャルエンジニアリング","meaning":"人の 136,"category":"防御・監視","term":"UTM","meaning":"Unified Threat Management。複数のセキュリティ機能を統合した仕組み","tip":"FW・IPS等を統合","attack":"","defense":"","why":"","page":"48"},{"id":137,"category":"防御・監視","term":"SIEM","meaning":"Security Information and Event Management。各種ログを集約・相関分析する仕組み","tip":"ログの司令塔","attack":"","defense":"","why":"","page":"48"},{"id":138,"category":"防御・監視","term":"CSPM","meaning":"Cloud Security Posture Management。IaaS等クラウド構成の設定ミスを検出・管理する仕組み","tip":"クラウド設定監査","attack":"","defense":"","why":"","page":"47"},{"id":139,"category":"防御・監視","term":"SSPM","meaning":"SaaS Security Posture Management。SaaSの設定やアカウントの安全性を確認する仕組み","tip":"SaaS設定監査","attack":"","defense":"","why":"","page":"47"},{"id":140,"category":"防御・監視","term":"DSPM","meaning":"Data Security Posture Management。データの所在・分類・保護状況を把握する仕組み","tip":"データ中心の管理","attack":"","defense":"","why":"","page":"47"},{"id":141,"category":"防御・監視","term":"IaaS","meaning":"Infrastructure as a Service。サーバーやストレージ等の基盤をクラウドで提供する形態","tip":"基盤のクラウド化","attack":"","defense":"","why":"","page":"47"},{"id":142,"category":"防御・監視","term":"PaaS","meaning":"Platform as a Service。アプリ実行・開発基盤をクラウドで提供する形態","tip":"実行環境のクラウド化","attack":"","defense":"","why":"","page":"47"},{"id":143,"category":"防御・監視","term":"SaaS","meaning":"Software as a Service。アプリケーションをサービスとして提供する形態","tip":"アプリのクラウド化","attack":"","defense":"","why":"","page":"47"},{"id":144,"category":"防御・監視","term":"脆弱性診断","meaning":"対象システムの弱点を検査すること","tip":"欠陥探し","attack":"","defense":"","why":"","page":"49"},{"id":145,"category":"防御・監視","term":"ペネトレーションテスト","meaning":"実際の侵入を想定した攻撃シミュレーションで安全性を検証すること","tip":"侵入試験","attack":"","defense":"","why":"","page":"49"},{"id":146,"category":"防御・監視","term":"監査ログ","meaning":"操作やアクセス等を調査可能にする記録","tip":"後から追跡","attack":"","defense":"","why":"","page":"48-49"},{"id":147,"category":"防御・監視","term":"セキュリティポリシー","meaning":"組織が守るべき情報セキュリティの方針とルール","tip":"組織の規則","attack":"","defense":"","why":"","page":"44-49"},{"id":148,"category":"バックアップ","term":"バックアップ","mean },{"id":162,"category":"認証・パスワード","term":"認証の3要素","meaning":"知識・所持・生体の3種類の本人確認要素","tip":"知っている・持っている・本人そのもの","attack":"","defense":"","why":"","page":"57"},{"id":163,"category":"認証・パスワード","term":"知識情報","meaning":"パスワードやPINなど本人が知っている情報","tip":"知識要素","attack":"","defense":"","why":"","page":"57"},{"id":164,"category":"認証・パスワード","term":"所持情報","meaning":"スマートフォンやセキュリティキー等本人が持つ物","tip":"所持要素","attack":"","defense":"","why":"","page":"57"},{"id":165,"category":"認証・パスワード","term":"生体情報","meaning":"指紋や顔など本人の身体的特徴","tip":"生体要素","attack":"","defense":"","why":"","page":"57"},{"id":166,"category":"認証・パスワード","term":"MFA","meaning":"Multi-Factor Authentication。異なる認証要素を2種類以上組み合わせる方式","tip":"パスワード＋スマホ等","attack":"","defense":"","why":"","page":"57"},{"id":167,"category":"認証・パスワード","term":"二段階認証","meaning":"認証を複数の手順で行う方式。必ずしも異なる要素とは限らない","tip":"MFAと混同注意","attack":"","defense":"","why":"","page":"57"},{"id":168,"category":"認証・パスワード","term":"ワンタイムパスワード","meaning":"短時間または1回のみ使用できる認証コード","tip":"使い捨てコード","attack":"","defense":"","why":"","page":"57"},{"id":169,"category":"認証・パスワード","term":"FIDO／FIDO2","meaning":"公開鍵暗号等を用いる認証の標準技術。パスキー等に利用される","tip":"フィッシング耐性","attack":"","defense":"","why":"","page":"57"},{"id":170,"category":"認証・パスワード","term":"パスキー","meaning":"端末などに保存される鍵でパスワード入力なしに認証できる方式","tip":"端末＋生体/PINで利用","attack":"","defense":"","why":"","page":"57"},{"id":171,"category":"認証・パスワード","term":"PIN","meaning":"Personal Identification Number。端末やカード操作に使う暗証番号","tip":"端末のロック解除等","attack":"","defense":"","why":"","page":"57"},{"id":172,"category":"認証・パスワード","term":"パスワードマネージャー","meaning":"複数のパスワードを安全に保管・入力支援するソフト","tip":"使い回し防止","attack":"","defense":"","why":"","page":"57"},{"id":173,"category":"認証・パスワード","term":"パスワード使い回し","meaning":"複数のサービスで同じパスワードを使用すること","tip":"1か所流出で連鎖被害","attack":"一箇所の漏えいで別サイトに侵入される","defense":"サービスごとに固有のパスワード、管理ツール、MFA","why":"流出した認証情報の連鎖利用を止める","page":"56"},{"id":174,"category":"メール・リテラシー","term":"SMS","meaning":"Short Message Service。電話番号宛の短いメッセージ","tip":"偽通知に注意","attack":"","defense":"","why":"","page":"58-59"},{"id":175,"category":"メール・リテラシー","term":"URL","meaning":"Uniform Resource Locator。インターネット上の資源の場所を示す表記","tip":"リンク先の正当性確認","attack":"","defense":"","why":"","page":"58-59"},{"id":176,"category":"メール・リテラシー","term":"メール添付ファイル","meaning":"メールに付けられたファイル","tip":"不用意に開かない","attack":"","defense":"","why":"","page":"58-59"},{"id":177,"category":"メール・リテラシー","term":"マクロ","meaning":"Office等で操作を自動実行するプログラム機能","tip":"悪用される場合がある","attack":"文書内の自動化機能に悪意ある処理を仕込む","defense":"インターネット由来マクロ無効化、添付検査、実行制限","why":"文書を開いた後の不正実行を防ぐ","page":"59"},{"id":178,"category":"メール・リテラシー","term":"情報リテラシー","meaning":"情報を適切に判断し安全に利用する能力","tip":"情報の真偽を見抜く","attack":"","defense":"","why":"","page":"54-55"},{"id":179,"category":"メール・リテラシー","term":"情報モラル","meaning":"情報社会で守るべき倫理やルール","tip":"他人の権利を守る","attack":"","defense":"","why":"","page":"54-55"},{"id":180,"category":"メール・リテラシー","term":"不審なリンク","meaning":"正規のサイトを装い危険なサイト等へ誘導するリンク","tip":"ブックマークから確認","attack":"偽サイトやマルウェア配布へ誘導","defense":"リンクを開かず公式アプリ・ブックマークから確認","why":"攻撃者の誘導経路を避ける","page":"58-59"},{"id":181,"category":"メール・リテラシー","term":"ブックマーク","meaning":"正規のWebサイトのURLを保存して再訪問する機能","tip":"偽リンク回避","attack":"","defense":"","why":"","page":"59"},{"id":182,"category":"メール・リテラシー","term":"セキュリティ教育","meaning":"従業員等に攻撃手口と対応方法を学んでもらう取り組み","tip":"人の対策","attack":"","defense":"","why":"","page":"54-55"}];
const $=id=>document.getElementById(id);
const STORAGE='ipa2026_flashcards_known_v1';
let known=new Set();try{known=new Set(JSON.parse(localStorage.getItem(STORAGE)||'[]'))}catch(e){}
let order=CARDS.map(c=>c.id), visible=[],index=0,revealed=false;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify([...known]))}catch(e){}}
function makeField(label,value,cls=''){if(!value)return null;let d=document.createElement('div');d.className='field '+cls;let l=document.createElement('div');l.className='label';l.textContent=label;let v=document.createElement('div');v.className='value';v.textContent=value;d.append(l,v);return d}
function setup(){[...new Set(CARDS.map(c=>c.category))].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)});['category','mode'].forEach(id=>$(id).addEventListener('change',()=>apply()));$('search').addEventListener('input',()=>apply());$('shuffle').addEventListener('click',()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}apply()});$('clear').addEventListener('click',()=>{$('category').value='';$('mode').value='all';$('search').value='';apply()});$('reveal').addEventListener('click',()=>{if(!visible.length)return;revealed=!revealed;render()});$('mark').addEventListener('click',()=>{if(!visible.length)return;const id=visible[index].id;if(known.has(id))known.delete(id);else known.add(id);save();const mode=$('mode').value;if(mode==='unknown'||mode==='known'){const nextId=visible[Math.min(index+1,visible.length-1)]?.id;apply(nextId)}else render()});$('next').addEventListener('click',()=>move(1));$('prev').addEventListener('click',()=>move(-1));document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '){e.preventDefault();if(visible.length){revealed=!revealed;render()}}});apply()}
function apply(prefer){let selected=$('category').value,mode=$('mode').value,q=$('search').value.trim().toLocaleLowerCase();let previous=visible[index]?.id;let lookup=new Map(CARDS.map(c=>[c.id,c]));visible=order.map(id=>lookup.get(id)).filter(c=>(!selected||c.category===selected)&&(!q||(c.term+' '+c.meaning+' '+c.tip).toLocaleLowerCase().includes(q))&&(mode==='all'||(mode==='unknown'&&!known.has(c.id))||(mode==='known'&&known.has(c.id))||(mode==='attack'&&c.defense)));let idx=visible.findIndex(c=>c.id===(prefer??previous));index=idx<0?0:idx;revealed=false;render()}
function move(n){if(!visible.length)return;index=(index+n+visible.length)%visible.length;revealed=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const c=visible[index];$('knownCount').textContent=known.size;$('remainCount').textContent=CARDS.length-known.size;$('progress').style.width=(known.size/CARDS.length*100)+'%';$('filterCount').textContent=visible.length+'語を表示中';$('card').hidden=!c;$('empty').hidden=!!c;for(let id of ['reveal','prev','next','mark'])$(id).disabled=!c;if(!c)return;$('counter').textContent=(index+1)+' / '+visible.length;$('catLabel').textContent=c.category;$('term').textContent=c.term;$('knownLabel').hidden=!known.has(c.id);$('mark').textContent=known.has(c.id)?'↩ 未習得に戻す':'✓ 覚えた';$('reveal').textContent=revealed?'答えを隠す':'意味を表示';$('answer').hidden=!revealed;const a=$('answer');a.replaceChildren();if(revealed){const fields=[['意味（答え）',c.meaning,'highlight'],['覚えるポイント',c.tip,''],['攻撃の仕組み・リスク',c.attack,''],['対応する対策・防御方法',c.defense,'defense'],['なぜその対策が有効か',c.why,'']];for(let [label,value,cls] of fields){let f=makeField(label,value,cls);if(f)a.append(f)}if(c.page){let p=document.createElement('div');p.className='reference';p.textContent='IPA資料 参照ページ：'+c.page;a.append(p)}}}
setup();
</script></body></html>
